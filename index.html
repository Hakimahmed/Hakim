<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Generator FIXED</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">

<style>
body {
  font-family: Arial;
  background: #f4f6f8;
  text-align: center;
  padding: 20px;
}

h1 {
  color: #006163;
}

input {
  width: 80%;
  padding: 12px;
  font-size: 18px;
  margin: 10px 0;
}

button {
  padding: 10px 15px;
  margin: 5px;
  cursor: pointer;
}

canvas {
  background: white;
  border: 1px solid #ccc;
}
</style>
</head>

<body>

<h1>GVU News Generator</h1>

<input id="headlineInput" placeholder="Enter headline">

<br>

<button id="generateBtn">Generate</button>
<button id="downloadBtn">Download</button>

<br><br>

<canvas id="canvas" width="1080" height="1350"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const headlineInput = document.getElementById("headlineInput");

// ================= IMAGES =================

const bg = new Image();
bg.src = "BG.png";

const logo = new Image();
logo.src = "GVU.png?v=" + Date.now(); // FIX CACHE

let userImage = null;

// ================= PASTE IMAGE =================

document.addEventListener("paste", (e) => {

  const items = e.clipboardData.items;

  for (let item of items) {

    if (item.type.indexOf("image") !== -1) {

      const file = item.getAsFile();

      const reader = new FileReader();

      reader.onload = (event) => {

        userImage = new Image();

        userImage.onload = () => {
          console.log("Image Loaded");
        };

        userImage.src = event.target.result;
      };

      reader.readAsDataURL(file);
    }
  }
});

// ================= DRAW TEXT =================

function drawText(text, x, y, maxWidth, size) {

  ctx.font = `700 ${size}px Montserrat`;
  ctx.fillStyle = "#000";

  let words = text.split(" ");
  let line = "";
  let lines = [];

  for (let word of words) {

    let test = line + word + " ";

    if (ctx.measureText(test).width > maxWidth && line !== "") {
      lines.push(line);
      line = word + " ";
    } else {
      line = test;
    }
  }

  lines.push(line);

  for (let i = 0; i < lines.length; i++) {

    let w = ctx.measureText(lines[i]).width;

    ctx.fillText(
      lines[i],
      x - w / 2,
      y + i * size * 1.2
    );
  }
}

// ================= GENERATE =================

function generate() {

  const text = headlineInput.value.trim();

  if (!text) {
    alert("Enter headline");
    return;
  }

  if (!userImage) {
    alert("Paste image first");
    return;
  }

  ctx.clearRect(0, 0, 1080, 1350);

  // BACKGROUND
  ctx.drawImage(bg, 0, 0, 1080, 1350);

  const temp = new Image();

  temp.onload = function () {

    // ================= FIX IMAGE FIT =================

    const maxW = 1030;
    const maxH = 750;

    const ratio = Math.min(
      maxW / temp.width,
      maxH / temp.height
    );

    const w = temp.width * ratio;
    const h = temp.height * ratio;

    const x = (1080 - w) / 2;
    const y = 120 + (maxH - h) / 2;

    ctx.drawImage(temp, x, y, w, h);

    // ================= LOGO (TOP LEFT ON IMAGE) =================

    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.fillRect(x + 15, y + 15, 140, 140);

    ctx.drawImage(logo, x + 25, y + 25, 120, 120);

    // ================= HEADLINE =================

    drawText(text, 540, 980, 900, 60);
  };

  // IMPORTANT FIX
  temp.src = userImage.src;
}

// ================= EVENTS =================

document.getElementById("generateBtn").onclick = generate;

document.getElementById("downloadBtn").onclick = function () {

  const a = document.createElement("a");

  a.download = "news.png";
  a.href = canvas.toDataURL("image/png");

  a.click();
};

</script>

</body>
</html>
